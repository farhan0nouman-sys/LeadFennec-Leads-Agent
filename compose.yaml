# Local development services. Started by `pnpm dev` (scripts/dev.mjs); docs in
# docs/local-development.md. Ports bind to 127.0.0.1 only. Credentials come from .env,
# which is git-ignored; nothing secret is stored in this file.
name: lead-fennec-ai

services:
  postgres:
    # PostgreSQL 18.6 (Debian trixie), pinned by digest. Verified 2026-10-31 (D-02B-03).
    image: postgres:18.6-trixie@sha256:979bccfde35445db618c65107d27d08c6c21339d8dc3ad4c830c6633947be0e4
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-leadfennec}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set. Copy .env.example to .env and set it}
      POSTGRES_DB: ${POSTGRES_DB:-leadfennec}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      # PostgreSQL 18+ images keep data in /var/lib/postgresql/18/docker; mount the parent.
      - postgres-data:/var/lib/postgresql
      # First start only: creates the isolated "<POSTGRES_DB>_test" database for tests.
      - ./infra/postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready --username="$${POSTGRES_USER}" --dbname="$${POSTGRES_DB}"',
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    # Redis 8.8.4 (Alpine), pinned by digest. Verified 2026-10-31 (D-02B-03).
    image: redis:8.8.4-alpine@sha256:ab669f1420eaa05360a417b24f3bd210c9272e2c79a4bb35d3e50b4bfd50dbee
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD is not set. Copy .env.example to .env and set it}
      - --appendonly
      - 'yes'
    environment:
      # Lets redis-cli in the health check authenticate without a password argument.
      REDISCLI_AUTH: ${REDIS_PASSWORD:?REDIS_PASSWORD is not set. Copy .env.example to .env and set it}
    ports:
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  postgres-data:
  redis-data:
