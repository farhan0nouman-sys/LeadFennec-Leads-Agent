# Verifies every push to main and every pull request: install from the lockfile, format,
# lint, typecheck, unit + integration tests (with real PostgreSQL/Redis test databases),
# build, and a Playwright browser smoke test. Uses no secrets; tests cannot reach the
# network beyond loopback (packages/shared/src/testing/network-guard.ts).
# Action versions and image digests: docs/decisions.md (D-02C-07).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      APP_ENV: test
      # CI only; local telemetry is an open choice (docs/decisions.md O-02).
      NEXT_TELEMETRY_DISABLED: '1'
      TURBO_TELEMETRY_DISABLED: '1'
      # Isolated test stores (database name must end in _test; Redis DB must not be 0).
      TEST_DATABASE_URL: postgresql://leadfennec:ci-ephemeral-not-secret@127.0.0.1:5432/leadfennec_test
      TEST_REDIS_URL: redis://127.0.0.1:6379/15
    services:
      postgres:
        image: postgres:18.6-trixie@sha256:979bccfde35445db618c65107d27d08c6c21339d8dc3ad4c830c6633947be0e4
        env:
          POSTGRES_USER: leadfennec
          # Throwaway password for a container that exists only for this job.
          POSTGRES_PASSWORD: ci-ephemeral-not-secret
          POSTGRES_DB: leadfennec_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username=leadfennec --dbname=leadfennec_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8.8.4-alpine@sha256:ab669f1420eaa05360a417b24f3bd210c9272e2c79a4bb35d3e50b4bfd50dbee
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm and Node.js 24
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          runtime: node@24
          cache: true
          install: false
          require-lockfile: true

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit and integration tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Install Playwright Chromium
        run: pnpm --filter @lead-fennec-ai/web exec playwright install --with-deps --only-shell chromium

      - name: Browser smoke test
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
          if-no-files-found: ignore
