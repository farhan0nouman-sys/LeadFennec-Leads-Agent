  postcss: 8.5.32
  prettier: 3.9.10
  prisma: 7.10.1
  react: 19.3.1
  react-dom: 19.3.1
  reflect-metadata: 0.2.2
  rxjs: 7.8.2
  tailwind-merge: 3.7.0
  tailwindcss: 4.3.3
  tslib: 2.8.1
  tsx: 4.23.15
  turbo: 2.11.10
  typescript: 6.0.3
  typescript-eslint: 8.72.1
  vite: 8.3.5
  vitest: 5.0.5
  zod: 4.6.7

saveExact: true

# Reviewed dependency build scripts (pnpm fails on unreviewed ones by default).
# esbuild / unrs-resolver: fallbacks that fetch or verify a native binary that pnpm already
# installs as an optional dependency, so they stay disabled.
# @prisma/engines: downloads Prisma's schema (migration) engine from binaries.prisma.sh,
# required by `prisma migrate`. prisma: preinstall only checks the Node.js version.
# msgpackr-extract (BullMQ, via msgpackr, task 07C): an optional native speed-up whose script
# would compile or load a prebuilt binary; msgpackr works without it, so it stays disabled.
allowBuilds:
  '@prisma/engines': true
  esbuild: false
  msgpackr-extract: false
  prisma: false
  unrs-resolver: false

# eslint-config-next 16.4 supports ESLint 10, but three plugins it bundles don't list
# ESLint 10 as a peer yet (documented by Next.js). Allowed for those plugins only.
peerDependencyRules:
  allowedVersions:
    eslint-plugin-import>eslint: '10'
    eslint-plugin-jsx-a11y>eslint: '10'
    eslint-plugin-react>eslint: '10'
